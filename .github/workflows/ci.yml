name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EventFlow.slnx
      - name: Build
        run: dotnet build EventFlow.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test EventFlow.slnx --configuration Release --no-build
